spring.application.name=hospital-appointment-system

# SQL Server connection
spring.datasource.url=jdbc:sqlserver://localhost:1434;databaseName=HospitalAppointmentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=SqlServer@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

server.port=8080

# JWT placeholders (real secret wired up in Phase 4)
app.jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.hibernate.SQL=debug